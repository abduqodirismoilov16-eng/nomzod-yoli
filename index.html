<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nomzod Yo'li</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#f5f7f9; --surface:#ffffff; --fg:#14202b; --muted:#5b6b78; --line:#dbe2e8;
  --accent:#1f6fd1; --accent-fg:#ffffff; --accent-soft:#e4eefb;
  --ok:#188a4f; --ok-soft:#e2f4ea; --warn:#b7791f; --warn-soft:#fbf0dc; --bad:#c2413a; --bad-soft:#fbe6e4;
  --font:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e151c; --surface:#16212b; --fg:#e6edf3; --muted:#9aabb9; --line:#27343f;
  --accent:#5aa2f5; --accent-fg:#06121f; --accent-soft:#16304d;
  --ok:#43c07f; --ok-soft:#123526; --warn:#e2a94a; --warn-soft:#3a2c12; --bad:#ef7c74; --bad-soft:#3d1c1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e151c; --surface:#16212b; --fg:#e6edf3; --muted:#9aabb9; --line:#27343f;
  --accent:#5aa2f5; --accent-fg:#06121f; --accent-soft:#16304d;
  --ok:#43c07f; --ok-soft:#123526; --warn:#e2a94a; --warn-soft:#3a2c12; --bad:#ef7c74; --bad-soft:#3d1c1a; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
body{padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
#app{max-width:720px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(14px + var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px)) 16px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.icon-btn{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:13.5px;font-weight:600;color:var(--accent);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 11px;cursor:pointer;flex-shrink:0}
.icon-btn svg{width:16px;height:16px}
.icon-btn:focus-visible{outline:3px solid var(--accent-soft)}
.top h1{font-size:18px;margin:0;font-weight:700}
.top .sub{font-size:13px;color:var(--muted)}
.bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
main{flex:1;padding:16px;display:flex;flex-direction:column;gap:18px}
footer.actions{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 16px calc(12px + max(env(safe-area-inset-bottom,0px), var(--tg-safe-area-inset-bottom,0px)));display:flex;gap:10px}
h2{font-size:20px;margin:0}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.lbl{font-size:13px;font-weight:600;color:var(--muted)}
.req::after{content:" *";color:var(--bad)}
input[type=text],input[type=tel],input[type=date],input[type=number],input[type=password],select,textarea{
  width:100%;font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;outline:none}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.invalid input,.invalid select,.invalid textarea,.invalid .chips{border-color:var(--bad)!important}
.invalid .chips{border:1px solid;border-radius:12px;padding:6px}
.err{font-size:13px;color:var(--bad)}
.hint{font-size:13px;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:2fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:14.5px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:8px 14px;cursor:pointer;min-height:40px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.chip:focus-visible,.btn:focus-visible{outline:3px solid var(--accent-soft);outline-offset:1px}
.rate{display:flex;gap:6px}
.rate .chip{min-width:44px;justify-content:center;padding:8px 0;text-align:center;flex:1}
.btn{font:inherit;font-weight:600;border:none;border-radius:12px;padding:13px 16px;cursor:pointer;background:var(--accent);color:var(--accent-fg);flex:1;min-height:48px}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
main>.btn{flex:none}
.btn.small{flex:none;padding:9px 14px;min-height:40px;font-size:14.5px}
.btn:disabled{opacity:.55;cursor:default}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.job{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.job b{display:block}
.job small{color:var(--muted);display:block}
main a{color:var(--accent)}
.link{background:none;border:none;color:var(--accent);font:inherit;font-weight:600;cursor:pointer;padding:4px}
.link.bad{color:var(--bad)}
.alert{border-radius:12px;padding:12px 14px;font-size:14.5px}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert.bad{background:var(--bad-soft);color:var(--bad)}
.alert.ok{background:var(--ok-soft);color:var(--ok)}
.alert ul{margin:6px 0 0;padding-left:18px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.check input{width:22px;height:22px;margin:0;flex-shrink:0;accent-color:var(--accent)}
.list{display:flex;flex-direction:column}
.item[data-cand]{cursor:pointer;border-radius:8px}
.item[data-cand]:hover .nm{color:var(--accent)}
.item[data-cand]:focus-visible{outline:3px solid var(--accent-soft)}
input[type=search]{width:100%;font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;outline:none}
input[type=search]:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.item{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none}
.item .nm{font-weight:600}
.item small{color:var(--muted)}
.pill{font-size:12px;font-weight:600;border-radius:999px;padding:3px 9px;white-space:nowrap;align-self:flex-start;background:var(--accent-soft);color:var(--accent)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.gray{background:var(--line);color:var(--muted)}
.pill.o{background:transparent;border:1px solid currentColor;padding:2px 8px}
.pills{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters .chip{min-height:34px;padding:5px 11px;font-size:13.5px}
.filters .chip i{font-style:normal;opacity:.75;margin-left:4px}
.lbl.up{text-transform:uppercase;letter-spacing:.05em;font-size:12px}
.log{display:flex;gap:10px;align-items:flex-start;font-size:14.5px}
.log .ic{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px}
.log small{display:block;color:var(--muted);font-size:12.5px}
.log .ic.ok{background:var(--ok-soft)}.log .ic.warn{background:var(--warn-soft)}.log .ic.bad{background:var(--bad-soft)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.row2{display:flex;gap:8px}.row2>*{flex:1;min-width:0}
.dim{position:fixed;inset:0;background:rgba(10,20,30,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:640px;margin:0 auto;background:var(--surface);border-radius:18px 18px 0 0;padding:16px 16px calc(16px + max(env(safe-area-inset-bottom,0px), var(--tg-safe-area-inset-bottom,0px)));display:flex;flex-direction:column;gap:12px;max-height:88vh;overflow:auto;box-shadow:0 -6px 24px rgba(0,0,0,.2)}
.sheet h2{margin:0;font-size:18px}
.sheet .seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.sheet .seg button[aria-pressed="true"][data-res="Keladi"]{background:var(--ok);border-color:var(--ok);color:#fff}
.sheet .seg button[aria-pressed="true"][data-res="Kutilmoqda"]{background:var(--warn);border-color:var(--warn);color:#fff}
.sheet .seg button[aria-pressed="true"][data-res="Rad etdi"]{background:var(--bad);border-color:var(--bad);color:#fff}
.review{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:6px 12px;font-size:14.5px}
.review dt{color:var(--muted)}
.review dd{margin:0;overflow-wrap:anywhere}
.review h3{grid-column:1/-1;margin:10px 0 0;font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.big-id{font-size:28px;font-weight:700;letter-spacing:.02em}
.center{text-align:center;align-items:center}
.saved{font-size:12.5px;color:var(--ok)}
.spinner{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;margin:40px auto}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation-duration:3s}.bar i{transition:none}}
.tabs{display:flex;gap:6px;background:var(--line);padding:4px;border-radius:12px}
.tabs button{flex:1;font:inherit;font-weight:600;font-size:14.5px;border:none;border-radius:9px;padding:9px;background:transparent;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days button{font:inherit;font-size:14px;min-width:52px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:7px 10px;cursor:pointer}
.days button.done{border-color:var(--ok);color:var(--ok);font-weight:600}
.att{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.att:last-child{border-bottom:none}
.att-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.att-top .nm{font-weight:600;min-width:0;overflow-wrap:anywhere}
.seg{display:flex;gap:6px}
.seg button{flex:1;font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:9px 4px;cursor:pointer;min-height:42px}
.seg button[aria-pressed="true"][data-v="Keldi"]{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:600}
.seg button[aria-pressed="true"][data-v="Kechikdi"]{background:var(--warn);border-color:var(--warn);color:#fff;font-weight:600}
.seg button[aria-pressed="true"][data-v="Kelmadi"]{background:var(--bad);border-color:var(--bad);color:#fff;font-weight:600}
.att .rate .chip{min-height:36px;padding:5px 0;font-size:14px}
.att.off{opacity:.6}
.seg button.pass[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:600}
.seg button.fail[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#fff;font-weight:600}
.pick{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.pick:last-child{border-bottom:none}
.pick input{width:22px;height:22px;accent-color:var(--accent);flex-shrink:0;margin:0}
.demo{font-size:12px;background:var(--warn-soft);color:var(--warn);text-align:center;padding:6px}
</style>
</head>
<body>
<div id="app"><div class="spinner" aria-label="Yuklanmoqda"></div></div>

<script>
/* =====================================================================
   SOZLASH: Apps Script'ni "Web app" sifatida joylagandan keyin
   berilgan havolani (…/exec) shu yerga qo'ying.
   Bo'sh qolsa ilova DEMO rejimida ishlaydi (Sheets'ga yozmaydi).
   ===================================================================== */
var API_URL = 'https://script.google.com/macros/s/AKfycbx-yrGtRqw4LaTrssUCaMdCKevyOScvHo3Oid5BO8mibSZMFc_Y9-MtlWgE3YW-7hQeIA/exec';

/* ------------------------------------------------------------------ */
var TG = window.Telegram && window.Telegram.WebApp;
var IN_TG = !!(TG && TG.initData);
var DEMO = !API_URL || /[?&]demo=1/.test(location.search);
var DRAFT_KEY = 'nomzod_anketa_qoralama_v1';

var REGIONS = {
  "Toshkent shahri": ["Bektemir","Chilonzor","Mirobod","Mirzo Ulug'bek","Olmazor","Sergeli","Shayxontohur","Uchtepa","Yakkasaroy","Yangihayot","Yashnobod","Yunusobod"],
  "Toshkent viloyati": ["Angren sh.","Bekobod sh.","Chirchiq sh.","Nurafshon sh.","Ohangaron sh.","Olmaliq sh.","Yangiyo'l sh.","Bekobod","Bo'ka","Bo'stonliq","Chinoz","Ohangaron","Oqqo'rg'on","O'rta Chirchiq","Parkent","Piskent","Qibray","Quyi Chirchiq","Toshkent tumani","Yangiyo'l","Yuqori Chirchiq","Zangiota"],
  "Andijon": ["Andijon sh.","Xonobod sh.","Andijon","Asaka","Baliqchi","Bo'ston","Buloqboshi","Izboskan","Jalaquduq","Marhamat","Oltinko'l","Paxtaobod","Qo'rg'ontepa","Shahrixon","Ulug'nor","Xo'jaobod"],
  "Farg'ona": ["Farg'ona sh.","Marg'ilon sh.","Qo'qon sh.","Quvasoy sh.","Bag'dod","Beshariq","Buvayda","Dang'ara","Farg'ona","Furqat","Oltiariq","O'zbekiston","Qo'shtepa","Quva","Rishton","So'x","Toshloq","Uchko'prik","Yozyovon"],
  "Namangan": ["Namangan sh.","Chortoq","Chust","Kosonsoy","Mingbuloq","Namangan","Norin","Pop","To'raqo'rg'on","Uchqo'rg'on","Uychi","Yangiqo'rg'on"],
  "Samarqand": ["Samarqand sh.","Kattaqo'rg'on sh.","Bulung'ur","Ishtixon","Jomboy","Kattaqo'rg'on","Narpay","Nurobod","Oqdaryo","Pastdarg'om","Paxtachi","Payariq","Qo'shrabot","Samarqand","Toyloq","Urgut"],
  "Buxoro": ["Buxoro sh.","Kogon sh.","Buxoro","G'ijduvon","Jondor","Kogon","Olot","Peshku","Qorako'l","Qorovulbozor","Romitan","Shofirkon","Vobkent"],
  "Navoiy": ["Navoiy sh.","Zarafshon sh.","Karmana","Konimex","Navbahor","Nurota","Qiziltepa","Tomdi","Uchquduq","Xatirchi"],
  "Qashqadaryo": ["Qarshi sh.","Shahrisabz sh.","Chiroqchi","Dehqonobod","G'uzor","Kasbi","Kitob","Koson","Ko'kdala","Mirishkor","Muborak","Nishon","Qamashi","Qarshi","Shahrisabz","Yakkabog'"],
  "Surxondaryo": ["Termiz sh.","Angor","Bandixon","Boysun","Denov","Jarqo'rg'on","Muzrabot","Oltinsoy","Qiziriq","Qumqo'rg'on","Sariosiyo","Sherobod","Sho'rchi","Termiz","Uzun"],
  "Jizzax": ["Jizzax sh.","Arnasoy","Baxmal","Do'stlik","Forish","G'allaorol","Mirzacho'l","Paxtakor","Sharof Rashidov","Yangiobod","Zafarobod","Zarbdor","Zomin"],
  "Sirdaryo": ["Guliston sh.","Shirin sh.","Yangiyer sh.","Boyovut","Guliston","Mirzaobod","Oqoltin","Sardoba","Sayxunobod","Sirdaryo","Xovos"],
  "Xorazm": ["Urganch sh.","Xiva sh.","Bog'ot","Gurlan","Hazorasp","Qo'shko'pir","Shovot","Tuproqqal'a","Urganch","Xiva","Xonqa","Yangiariq","Yangibozor"],
  "Qoraqalpog'iston": ["Nukus sh.","Amudaryo","Beruniy","Bo'zatov","Chimboy","Ellikqal'a","Kegeyli","Mo'ynoq","Nukus","Qanliko'l","Qo'ng'irot","Qorao'zak","Shumanay","Taxiatosh","Taxtako'pir","To'rtko'l","Xo'jayli"]
};

var OPTS = {
  oilaviy: ["Uylanmagan","Uylangan","Ajrashgan"],
  malumot: ["O'rta","O'rta maxsus","Talaba","Oliy"],
  kompyuter: ["Past","O'rta","Yuqori"],
  dasturlar: ["CRM","Word","Excel","Google Sheets"],
  til: ["Bilmaydi","Boshlang'ich","O'rta","Yaxshi"],
  kurs: ["1","2","3","4","5"],
  qaror: ["O'qishga taklif qilindi","Zaxirada","Rad etildi"]
};
var OYLAR = ["Yanvar","Fevral","Mart","Aprel","May","Iyun","Iyul","Avgust","Sentabr","Oktabr","Noyabr","Dekabr"];

var state = {
  screen: 'loading', auth: null, user: null,
  config: { vakansiyalar: [], manbalar: [], smenalar: [], millatlar: [] },
  recent: [], step: 0, d: null, errors: {}, phoneMatches: null, jobEdit: null,
  submitting: false, submitError: '', lastId: '', savedAt: 0
};

/* ---------------- Storage helpers ---------------- */
function lsGet(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } }
function lsSet(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
function lsDel(k){ try { localStorage.removeItem(k); } catch(e){} }
function ssGet(k){ try { return sessionStorage.getItem(k); } catch(e){ return null; } }
function ssSet(k,v){ try { sessionStorage.setItem(k,v); } catch(e){} }
/* Tezlik uchun kesh: oxirgi ko'rilgan ma'lumot darhol ko'rsatiladi, yangisi orqada yuklanadi */
var CACHE_KEY = 'nomzod_kesh_v1', CACHE_MAX_CARDS = 60, cacheObj = null;
function cache(){ if (!cacheObj) { cacheObj = lsGet(CACHE_KEY); if (!cacheObj || typeof cacheObj !== 'object') cacheObj = { recent:{}, cards:{}, order:[] }; } return cacheObj; }
var cacheTimer = null;
function cacheSave(){ clearTimeout(cacheTimer); cacheTimer = setTimeout(function(){ if (DEMO) return; lsSet(CACHE_KEY, cacheObj); }, 300); }
function cachePut(k, v){ cache()[k] = v; cacheSave(); }
function cacheCard(id, data, meta){
  var c = cache(); c.cards[id] = { data: data, meta: meta };
  c.order = c.order.filter(function(x){ return x !== id; }); c.order.push(id);
  while (c.order.length > CACHE_MAX_CARDS) delete c.cards[c.order.shift()];
  cacheSave();
}
function cacheClear(){ cacheObj = { recent:{}, cards:{}, order:[] }; lsDel(CACHE_KEY); }

function emptyAnketa(){
  return { clientId: 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2,8),
    fio:'', tugilgan:'', telefon:'', millati:'', oilaviy:'',
    viloyat:'', tuman:'', mahalla:'', kocha:'', uy:'',
    malumot:'', otm:'', fakultet:'', kurs:'',
    ish:[], oylik:'',
    kompyuter:'', dasturlar:[], rus:'', ingliz:'', boshqaTil:'', boshqa:'',
    vakansiya:'', manba:'', smena:'', nimaUchun:'', tarif:'',
    muloqot:'', motivatsiya:'', korinish:'', izoh:'', qaror:'', tasdiq:false, hrName:'' };
}

/* ---------------- API ---------------- */
var demoDb = { rows: [], seq: 0 };
function api(action, data){
  if (DEMO) return demoApi(action, data);
  return fetch(API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({ action: action, auth: state.auth, data: data || {} }) })
    .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(j){ if(!j.ok){ var e = new Error(j.error || 'Xatolik'); e.code = j.code; throw e; } return j; });
}
function demoApi(action, data){
  return new Promise(function(res){ setTimeout(function(){
    if (action === 'config') res({ ok:true, user:{ name:'Demo HR' }, config:{
      vakansiyalar:['Operator','Sotuv menejeri','Kassir'], manbalar:['Telegram guruh','Tanish orqali','Instagram','Boshqa'],
      smenalar:['Kunduzgi','Kechki','Tungi',"Farqi yo'q"], millatlar:["O'zbek","Rus","Qozoq","Tojik","Qoraqalpoq","Boshqa"] } });
    else if (action === 'checkPhone') res({ ok:true, matches: demoDb.rows.filter(function(r){ return digits(r.phone) === digits(data.phone); }) });
    else if (action === 'recent') res({ ok:true, counts:{}, items: demoDb.rows.slice().reverse() });
    else if (action === 'groupCandidates') res({ ok:true, items: demoDb.rows.filter(function(r){ return /taklif/.test(r.holat) && !r.group; }).map(function(r){ return { id:r.id, name:r.name, vakansiya:r.vakansiya, date:r.date }; }) });
    else if (action === 'createGroup') { demoDb.g = (demoDb.g || 0) + 1; var gname = '#' + demoDb.g; var st = new Date(data.start); var ex = new Date(st.getTime() + 5*864e5);
      demoDb.rows.forEach(function(r){ if (data.ids.indexOf(r.id) > -1) { r.group = gname; r.holat = "O'qishda"; } });
      (demoDb.groups = demoDb.groups || []).push({ group:gname, start:data.start, exam: ex.toISOString().slice(0,10), att:{} }); res({ ok:true, group:gname, count:data.ids.length, exam: ex.toISOString().slice(0,10) }); }
    else if (action === 'addToGroup') { demoDb.rows.forEach(function(r){ if (data.ids.indexOf(r.id) > -1) { r.group = data.group; r.holat = "O'qishda"; } }); res({ ok:true, group:data.group, count:data.ids.length }); }

    else if (action === 'getDay') { var g = demoDb.groups.filter(function(x){ return x.group === data.group; })[0];
      res({ ok:true, threshold:2, items: demoDb.rows.filter(function(r){ return r.group === data.group; }).map(function(r){ var abs = 0; Object.keys(g.att).forEach(function(d){ if (+d !== data.day && g.att[d][r.id] && g.att[d][r.id].holat === 'Kelmadi') abs++; });
        return { id:r.id, name:r.name, status:r.holat, absences:abs, entry: g.att[data.day] && g.att[data.day][r.id] || null }; }) }); }
    else if (action === 'saveDay') { var g2 = demoDb.groups.filter(function(x){ return x.group === data.group; })[0]; g2.att[data.day] = {}; data.entries.forEach(function(e){ g2.att[data.day][e.id] = e; });
      var exp = [], warn = []; demoDb.rows.filter(function(r){ return r.group === data.group; }).forEach(function(r){ var abs = 0; Object.keys(g2.att).forEach(function(d){ if (g2.att[d][r.id] && g2.att[d][r.id].holat === 'Kelmadi') abs++; });
        if (abs >= 2 && r.holat === "O'qishda") { r.holat = 'Chetlatildi'; exp.push(r.name); } else if (abs === 1 && data.entries.some(function(e){ return e.id === r.id && e.holat === 'Kelmadi'; })) warn.push(r.name); });
      res({ ok:true, expelled:exp, warned:warn, restored:[] }); }
    else if (action === 'submitAnketa') {
      demoDb.seq++; var id = 'N-DEMO-' + ('000' + demoDb.seq).slice(-4);
      demoDb.rows.push({ id:id, date:new Date().toLocaleDateString('ru-RU'), name:data.fio, phone:fmtPhone(data.telefon), vakansiya:data.vakansiya, holat:data.qaror });
      res({ ok:true, id:id });
    }
  }, 350); });
}

/* ---------------- Utils ---------------- */
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function digits(s){ var d = String(s||'').replace(/\D/g,''); if (d.length === 9) d = '998' + d; return d; }
function fmtPhone(s){
  var d = String(s||'').replace(/\D/g,''); if (d.indexOf('998') === 0) d = d.slice(3); d = d.slice(0,9);
  var out = '+998'; if (d.length) out += ' ' + d.slice(0,2); if (d.length > 2) out += ' ' + d.slice(2,5);
  if (d.length > 5) out += ' ' + d.slice(5,7); if (d.length > 7) out += ' ' + d.slice(7,9); return out;
}
function phoneComplete(s){ return digits(s).length === 12; }
function age(iso){
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||''); if(!m) return null;
  var n = new Date(), a = n.getFullYear() - +m[1];
  if (n.getMonth()+1 < +m[2] || (n.getMonth()+1 === +m[2] && n.getDate() < +m[3])) a--; return a;
}
function fmtDate(iso){ var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||''); return m ? m[3]+'.'+m[2]+'.'+m[1] : ''; }
function monthLabel(v){ var m = /^(\d{4})-(\d{2})$/.exec(v||''); return m ? OYLAR[+m[2]-1].slice(0,3) + ' ' + m[1] : 'Hozirgacha'; }
function months(from, to){
  var a = /^(\d{4})-(\d{2})$/.exec(from||''); if(!a) return 0; var b = /^(\d{4})-(\d{2})$/.exec(to||''); var n = new Date();
  var ty = b ? +b[1] : n.getFullYear(), tm = b ? +b[2] : n.getMonth()+1; return Math.max(0, (ty - +a[1]) * 12 + (tm - +a[2]) + 1);
}
function expLabel(m){ if(!m) return "Tajriba yo'q"; var y = Math.floor(m/12), r = m % 12; return [y ? y + ' yil' : '', r ? r + ' oy' : ''].filter(Boolean).join(' '); }
function money(s){ var d = String(s||'').replace(/\D/g,''); return d ? d.replace(/\B(?=(\d{3})+(?!\d))/g,' ') : ''; }
function haptic(){ try { TG && TG.HapticFeedback && TG.HapticFeedback.selectionChanged(); } catch(e){} }

var WAY_IC = { "Qo'ng'iroq": '📞', SMS: '✉', Telegram: '✈' };
function statusPill(h){ var c = h === ST.PASSED ? 'ok' : h === ST.FAILED ? 'bad' : /taklif/i.test(h) ? 'ok' : /zaxira/i.test(h) ? 'warn' : /rad|chetlat/i.test(h) ? 'bad' : /kelmadi/i.test(h) ? 'gray' : ''; return '<span class="pill ' + c + '">' + esc(h) + '</span>'; }
/* Ro'yxatdagi ikkinchi belgi: xabar berilgani yoki o'qishni boshlagani */
function extraPill(r){
  if (r.holat === ST.NEW) {
    if (!r.natija) return '<span class="pill warn">⚠ Xabar berilmagan</span>';
    var ic = WAY_IC[r.usul] || '📞';

function openDay(group, day){

  api('getDay', { group: group, day: day }).then(function(j){
    var v = state.dayv; v.items = j.items; v.threshold = j.threshold;
    j.items.forEach(function(it){ v.marks[it.id] = it.entry ? { holat: it.entry.holat, baho: it.entry.baho ? String(it.entry.baho) : '', izoh: it.entry.izoh || '' } : { holat:'', baho:'', izoh:'' }; });
    render();
  }).catch(function(e){ state.dayv.items = []; state.dayv.error = e.message; render(); });

function saveDay(){
  var v = state.dayv;
  var missing = v.items.filter(function(it){ return it.status !== 'Chetlatildi' && it.status !== ST.NOSHOW && !v.marks[it.id].holat; });
  if (missing.length) { v.error = 'Davomat belgilanmagan: ' + missing.map(function(x){ return x.name; }).join(', '); render(); var b = document.querySelector('.alert.bad'); b && b.scrollIntoView({ block:'center' }); return; }
  var entries = v.items.filter(function(it){ return v.marks[it.id].holat; }).map(function(it){ var m = v.marks[it.id]; return { id: it.id, holat: m.holat, baho: m.baho, izoh: m.izoh }; });
  v.saving = true; v.error = ''; render();
  api('saveDay', { group: v.group, day: v.day, entries: entries }).then(function(j){
    var parts = [v.day + '-kun davomati saqlandi.'];
    if (j.expelled && j.expelled.length) parts.push('Chetlatildi: <b>' + j.expelled.map(esc).join(', ') + '</b>.');
    if (j.noshow && j.noshow.length) parts.push('O\'qishga kelmadi: <b>' + j.noshow.map(esc).join(', ') + '</b>.');
    if (j.warned && j.warned.length) parts.push('Ogohlantirish: ' + j.warned.map(esc).join(', ') + '.');
    if (j.restored && j.restored.length) parts.push("Qayta tiklandi: " + j.restored.map(esc).join(', ') + '.');
    state.flash = { cls: (j.expelled && j.expelled.length) || (j.noshow && j.noshow.length) ? 'warn' : 'ok', text: parts.join(' ') }; goGroups();
  }).catch(function(e){ v.saving = false; v.error = e.message === 'Failed to fetch' ? "Internet aloqasi yo'q. Qayta urinib ko'ring." : e.message; render(); });
}
document.addEventListener('click', function(e){
  var t = e.target.closest('button'); if (!t) return;
  if (t.id === 'tab-anketa') { state.flash = null; state.tab = 'anketa'; render(); loadRecent(); return; }
  if (t.id === 'tab-guruh') { goGroups(); return; }
  if (t.id === 'g-new') return openGroupNew();
  if (t.dataset.addto) return openGroupNew(t.dataset.addto);
  if (t.id === 'g-cancel' || t.id === 'd-back') return goGroups();
  if (t.id === 'g-create') return createGroup();
  if (t.id === 'd-save') return saveDay();
  if (t.dataset.exam) return openExam(t.dataset.exam);
  if (t.id === 'e-back') return goGroups();
  if (t.id === 'e-save') return saveExam();
  if (state.screen === 'exam' && state.examv && t.dataset.eres) { var em = state.examv.marks[t.dataset.eres]; em.natija = em.natija === t.dataset.v ? '' : t.dataset.v; em.manual = !!em.natija; state.examv.error = ''; haptic(); keepScroll(); return; }
  if (t.dataset.day) return openDay(t.dataset.group, +t.dataset.day);
  var v = state.dayv; if (!v || state.screen !== 'day') return;
  if (t.dataset.att || t.id === 'all-present') v.error = '';
  if (t.id === 'all-present') { v.items.forEach(function(it){ if (it.status !== 'Chetlatildi' && it.status !== ST.NOSHOW && !v.marks[it.id].holat) v.marks[it.id].holat = 'Keldi'; }); haptic(); keepScroll(); return; }
  if (t.dataset.att) { var m = v.marks[t.dataset.att]; m.holat = m.holat === t.dataset.v ? '' : t.dataset.v; if (m.holat === 'Kelmadi') m.baho = ''; haptic(); keepScroll(); return; }
  if (t.dataset.baho) { var mb = v.marks[t.dataset.baho]; mb.baho = mb.baho === t.dataset.v ? '' : t.dataset.v; haptic(); keepScroll(); return; }
  if (t.dataset.izohOpen) { v.open[t.dataset.izohOpen] = true; keepScroll(); var x = document.querySelector('[data-izoh="' + t.dataset.izohOpen + '"]'); x && x.focus(); return; }
});

function openExam(group){
  state.flash = null; state.examv = { group: group, items: null, marks: {}, passMark: 80, saving: false, error: '' }; state.screen = 'exam'; render(); scrollTop();
  api('getExam', { group: group }).then(function(j){
    var v = state.examv; v.items = j.items || []; v.passMark = j.passMark || 80;
    v.items.forEach(function(it){ v.marks[it.id] = { ball: it.ball === '' || it.ball == null ? '' : String(it.ball), natija: it.natija || '', izoh: it.izoh || '', manual: false, orig: (it.ball === '' || it.ball == null ? '' : String(it.ball)) + '|' + (it.natija || '') + '|' + (it.izoh || '') };
      if (v.marks[it.id].natija && v.marks[it.id].ball === '') v.marks[it.id].manual = true; });
    render();
  }).catch(function(e){ state.examv.items = []; state.examv.error = e.message; render(); });
}
function autoRes(v, ball){ if (ball === '' || isNaN(+ball)) return ''; return +ball >= v.passMark ? "O'tdi" : "O'tmadi"; }
function examBallInput(t){
  var v = state.examv, m = v.marks[t.dataset.ball]; var val = t.value.replace(',', '.').replace(/[^\d.]/g, '');
  if (val !== '' && +val > 100) val = '100';
  m.ball = val; m.natija = autoRes(v, val); m.manual = false; v.error = '';
  var row = t.closest('.att'); if (row) row.querySelectorAll('[data-eres]').forEach(function(b){ b.setAttribute('aria-pressed', String(b.dataset.v === m.natija)); });
  examCounts();
}
function examCounts(){
  var v = state.examv, p = 0, f = 0; Object.keys(v.marks).forEach(function(k){ if (v.marks[k].natija === "O'tdi") p++; else if (v.marks[k].natija === "O'tmadi") f++; });
  var el = document.getElementById('e-counts'); if (el) el.innerHTML = examCountsHtml(p, f);
  return { p: p, f: f };
}
function examCountsHtml(p, f){ return '<span class="pill ok">O\'tdi ' + p + '</span><span class="pill bad">O\'tmadi ' + f + '</span>'; }
function examHtml(){
  var v = state.examv, html = '<header class="top"><div class="top-row"><h1>Guruh ' + esc(v.group) + ' · Imtihon</h1></div>';
  if (v.items && v.items.length) { var p = 0, f = 0; Object.keys(v.marks).forEach(function(k){ if (v.marks[k].natija === "O'tdi") p++; else if (v.marks[k].natija === "O'tmadi") f++; });
    html += '<div id="e-counts" style="display:flex;gap:6px;flex-wrap:wrap">' + examCountsHtml(p, f) + '</div>'; }
  html += '</header><main>';
  if (!v.items) return html + '<div class="spinner"></div></main>';
  if (!v.items.length) return html + '<p class="hint">Bu guruhda nomzod yo\'q.</p>' + (v.error ? '<div class="alert bad">' + esc(v.error) + '</div>' : '') + '</main>';
  html += '<p class="hint">Ball yozing (0–100): ' + v.passMark + ' va undan yuqori bo\'lsa "O\'tdi" o\'zi belgilanadi. Ball yozmasdan to\'g\'ridan-to\'g\'ri tugmani bossangiz ham bo\'ladi.</p>';
  html += '<div class="card" style="gap:0;padding-block:2px">' + v.items.map(function(it){
    var m = v.marks[it.id];
    if (!it.can) return '<div class="att off"><div class="att-top"><span class="nm">' + esc(it.name) + '</span>' + statusPill(it.status) + '</div></div>';
    return '<div class="att"><div class="att-top"><span class="nm">' + esc(it.name) + '</span>' +
      '<input type="text" inputmode="decimal" data-ball="' + esc(it.id) + '" value="' + esc(m.ball) + '" placeholder="Ball" aria-label="Ball" style="width:78px;flex:none;text-align:center;font-size:16px;padding:8px"></div>' +
      '<div class="seg" role="group" aria-label="Natija">' + ["O'tdi", "O'tmadi"].map(function(h){ return '<button type="button" class="' + (h === "O'tdi" ? 'pass' : 'fail') + '" data-eres="' + esc(it.id) + '" data-v="' + esc(h) + '" aria-pressed="' + (m.natija === h) + '">' + (h === "O'tdi" ? '✓ ' : '✕ ') + esc(h) + '</button>'; }).join('') + '</div>' +
      '<input type="text" data-eizoh="' + esc(it.id) + '" placeholder="Izoh (ixtiyoriy)" value="' + esc(m.izoh) + '">' +
      '</div>';
  }).join('') + '</div>';
  if (v.error) html += '<div class="alert bad">' + esc(v.error) + '</div>';
  return html + '</main><footer class="actions"><button class="btn ghost" id="e-back">Orqaga</button><button class="btn" id="e-save"' + (v.saving ? ' disabled' : '') + '>' + (v.saving ? 'Saqlanmoqda…' : 'Saqlash') + '</button></footer>';
}
function saveExam(){
  var v = state.examv; if (!v || !v.items) return;
  var entries = v.items.filter(function(it){ var m = v.marks[it.id]; return it.can && (m.ball + '|' + m.natija + '|' + m.izoh) !== m.orig; })
    .map(function(it){ var m = v.marks[it.id]; return { id: it.id, ball: m.ball, natija: m.natija, izoh: m.izoh }; });
  if (!entries.length) { v.error = "Hech narsa o'zgarmadi. Nomzodga ball yozing yoki O'tdi / O'tmadi ni bosing."; render(); return; }
  v.saving = true; v.error = ''; render();
  api('saveExam', { group: v.group, entries: entries }).then(function(j){
    var parts = ['Imtihon natijasi saqlandi.'];
    if (j.passed && j.passed.length) parts.push("O'tdi: <b>" + j.passed.map(esc).join(', ') + '</b>.');
    if (j.failed && j.failed.length) parts.push("O'tmadi: " + j.failed.map(esc).join(', ') + '.');
    state.flash = { cls: 'ok', text: parts.join(' ') }; goGroups();
  }).catch(function(e){ v.saving = false; v.error = e.message === 'Failed to fetch' ? "Internet aloqasi yo'q. Qayta urinib ko'ring." : e.message; render(); });
}
function keepScroll(){ var y = window.scrollY; render(); window.scrollTo(0, y); }
document.addEventListener('input', function(e){
  var t = e.target;
  if (t.dataset && t.dataset.izoh && state.dayv && state.screen === 'day') state.dayv.marks[t.dataset.izoh].izoh = t.value;
  if (t.dataset && t.dataset.eizoh && state.examv) state.examv.marks[t.dataset.eizoh].izoh = t.value;
  if (t.dataset && t.dataset.ball && state.examv) examBallInput(t);
});
document.addEventListener('change', function(e){
  var t = e.target;
  if (t.id === 'g-start' && state.gnew) state.gnew.start = t.value;
  if (t.dataset && t.dataset.pick && state.gnew) { state.gnew.picked[t.dataset.pick] = t.checked; var b = document.getElementById('g-create'); var n = Object.keys(state.gnew.picked).filter(function(k){ return state.gnew.picked[k]; }).length; if (b) { b.disabled = !n; b.textContent = (state.gnew.target ? 'Qo\'shish (' : 'Guruh tuzish (') + n + ')'; } }
});


/* ================= Nomzod kartasi ================= */
var candInflight = {};
function fetchCand(id){
  var f = candInflight[id];
  if (f && Date.now() - f.t < 15000) return f.p;
  var p = api('getCandidate', { id: id }).then(function(j){ cacheCard(id, j.data, j.meta); return j; });
  p.catch(function(){ delete candInflight[id]; });
  candInflight[id] = { p: p, t: Date.now() };
  return p;
}
function prefetchCand(id){ if (!DEMO && id) fetchCand(id).catch(function(){}); }
function openCand(id, keepFlash, fresh){
  if (!keepFlash) state.flash = null;
  state.sheet = null;
  if (fresh) delete candInflight[id];
  var hit = cache().cards[id];
  var same = state.screen === 'cand' && state.cand && state.cand.id === id && state.cand.data;
  state.cand = { id: id, loading: !hit, stale: !!hit, data: hit ? hit.data : null, meta: hit ? hit.meta : null, error: '' };
  state.screen = 'cand'; if (same) keepScroll(); else { render(); scrollTop(); }
  var my = state.cand;
  fetchCand(id).then(function(j){ if (state.cand !== my) return; my.loading = false; my.stale = false; my.data = j.data; my.meta = j.meta; if (state.screen === 'cand') keepScroll(); })
    .catch(function(e){ if (state.cand !== my) return; my.loading = false; if (!my.data) my.error = e.message === 'Failed to fetch' ? "Internet aloqasi yo'q." : e.message; else { my.stale = false; toastErr(e); } if (state.screen === 'cand') keepScroll(); });
}
/* Barmoq tekkanda kartochkani oldindan yuklaymiz */

    (m.qoldirgan ? '<span class="pill warn">' + esc(m.qoldirgan) + ' kun qoldirgan</span>' : '') + (m.imtihon !== '' && m.imtihon != null ? '<span class="pill ok">Imtihon: ' + esc(m.imtihon) + '</span>' : '') + '</div>';

  html += contactCardHtml(m) + trainingCardHtml(m);

}

var RES_LIST = ['Keladi','Kutilmoqda','Javob bermadi',"Raqam o'chiq",'Rad etdi'];
var RES_CLS = { 'Keladi':'ok', 'Kutilmoqda':'warn', 'Javob bermadi':'warn', "Raqam o'chiq":'warn', 'Rad etdi':'bad' };
var RES_TEXT = { 'Keladi':'kelishini tasdiqladi', 'Kutilmoqda':'javobi kutilmoqda', 'Javob bermadi':'javob bermadi', "Raqam o'chiq":"raqam o'chiq", 'Rad etdi':'kelmasligini aytdi' };
var NOSHOW_REASONS = ['Javob bermadi','Boshqa ish topdi','Fikridan qaytdi','Sababsiz kelmadi'];
function notStarted(m){ return m.holat === ST.STUDYING && !m.boshlagan; }
function canContact(m){ return m.holat === ST.NEW || m.holat === ST.NOSHOW || notStarted(m); }
function todayIso(){ var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth()+1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function dmyToIso(s){ var m = /^(\d{2})\.(\d{2})\.(\d{4})$/.exec(s || ''); return m ? m[3] + '-' + m[2] + '-' + m[1] : ''; }
function contactCardHtml(m){
  var log = m.aloqa || [];
  if (!canContact(m) && !log.length) return '';
  var html = '<div class="card"><span class="lbl up">O\'qish kuni haqida xabar</span>';
  if (!log.length) html += '<p class="hint" style="margin:0">Hali xabar berilmagan.</p>';
  html += log.map(function(a){
    return '<div class="log"><div class="ic ' + (RES_CLS[a.natija] || '') + '">' + (WAY_IC[a.usul] || '📞') + '</div><div><b>' + esc(a.usul) + ' — ' + esc(RES_TEXT[a.natija] || a.natija) + '</b>' +
      '<small>' + esc(a.sana) + (a.oqish ? ' · O\'qish kuni: ' + esc(a.oqish) : '') + (a.hr ? ' · ' + esc(a.hr) : '') + '</small>' + (a.izoh ? '<small>Izoh: ' + esc(a.izoh) + '</small>' : '') + '</div></div>';
  }).join('');
  if (canContact(m)) html += '<div class="row2"><button type="button" class="btn ghost small" data-contact="Qo\'ng\'iroq">📞 Qo\'ng\'iroq</button><button type="button" class="btn ghost small" data-contact="SMS">✉ SMS</button></div>';
  return html + '</div>';
}
function trainingCardHtml(m){
  var body = '', btn = '';
  if (m.holat === ST.NEW) { body = 'Hali guruhga qo\'shilmagan.' + (m.oqishKuni ? ' O\'qish kuni: <b>' + esc(m.oqishKuni) + '</b>' : ''); btn = '<button type="button" class="btn danger small" id="ns-open">O\'qishga kelmadi deb belgilash</button>'; }
  else if (notStarted(m)) { body = 'Guruh ' + esc(m.guruh) + '. <b>Hali bir kun ham darsga kelmagan.</b>' + (m.qoldirgan ? ' ' + esc(m.qoldirgan) + ' kun qoldirdi.' : ''); btn = '<button type="button" class="btn danger small" id="ns-open">O\'qishga kelmadi deb belgilash</button>'; }
  else if (m.holat === ST.STUDYING) body = '<span style="color:var(--ok);font-weight:600">✓ O\'qishni boshlagan: ' + esc(m.boshlagan) + '</span>' + (m.guruh ? ' · Guruh ' + esc(m.guruh) : '');
  else if (m.holat === ST.NOSHOW) { body = '<b>O\'qishga kelmadi.</b>' + (m.sabab ? ' Sabab: ' + esc(m.sabab) : '') + (m.guruh ? ' · Guruh ' + esc(m.guruh) : ''); btn = '<button type="button" class="btn ghost small" id="ns-undo">Qayta taklif qilish</button>'; }
  else if (m.holat === ST.EXPELLED) body = (m.boshlagan ? 'O\'qishni ' + esc(m.boshlagan) + ' da boshlagan, keyin ' : '') + esc(m.qoldirgan || 2) + ' kun qoldirgani uchun chetlatildi.';
  else return '';
  return '<div class="card"><span class="lbl up">O\'qish</span><div class="hint" style="color:var(--fg)">' + body + '</div>' + btn + '</div>';
}
function sheetHtml(){
  var sh = state.sheet; if (!sh) return '';
  var html = '<div class="dim" id="sh-close"></div><div class="sheet" role="dialog" aria-modal="true">';
  if (sh.type === 'contact') {
    html += '<h2>Xabar berildi</h2><span class="lbl up">Usul</span><div class="seg">' + ["Qo'ng'iroq",'SMS','Telegram'].map(function(u){ return '<button type="button" data-usul="' + esc(u) + '" aria-pressed="' + (sh.usul === u) + '">' + WAY_IC[u] + ' ' + esc(u) + '</button>'; }).join('') + '</div>' +
      '<span class="lbl up">Natija</span><div class="seg">' + RES_LIST.slice(0,3).map(resBtn).join('') + '</div><div class="seg">' + RES_LIST.slice(3).map(resBtn).join('') + '</div>' +
      '<div class="row2"><div class="field"><label for="sh-sana">Sana</label><input type="date" id="sh-sana" value="' + esc(sh.sana) + '"></div><div class="field"><label for="sh-oqish">O\'qish kuni</label><input type="date" id="sh-oqish" value="' + esc(sh.oqish) + '"></div></div>' +
      '<input type="text" id="sh-izoh" placeholder="Izoh (ixtiyoriy)" value="' + esc(sh.izoh) + '">' +
      (sh.natija === 'Rad etdi' ? '<div class="alert warn" style="padding:8px 10px;font-size:13.5px">Saqlanganda holat "O\'qishga kelmadi" bo\'ladi.</div>' : '');
  } else {
    html += '<h2>O\'qishga kelmadi</h2><p class="hint" style="margin:0">Nomzod o\'qishni boshlamadi. Keyinroq kelsa, "Qayta taklif qilish" tugmasi bilan qaytarasiz.</p><span class="lbl up">Sabab</span><div class="chips">' +
      NOSHOW_REASONS.map(function(r){ return '<button type="button" class="chip" data-sabab="' + esc(r) + '" aria-pressed="' + (sh.sabab === r) + '">' + esc(r) + '</button>'; }).join('') + '</div>' +
      '<input type="text" id="sh-izoh" placeholder="Izoh (ixtiyoriy)" value="' + esc(sh.izoh) + '">';
  }
  if (sh.error) html += '<div class="alert bad">' + esc(sh.error) + '</div>';
  return html + '<div class="row2"><button type="button" class="btn ghost" id="sh-cancel">Bekor qilish</button><button type="button" class="btn" id="sh-save"' + (sh.saving ? ' disabled' : '') + '>' + (sh.saving ? 'Saqlanmoqda…' : 'Saqlash') + '</button></div></div>';
}
function resBtn(r){ return '<button type="button" data-res="' + esc(r) + '" aria-pressed="' + (state.sheet.natija === r) + '">' + esc(r) + '</button>'; }
function openSheet(type, usul){
  var m = state.cand.meta;
  state.sheet = type === 'contact' ? { type:'contact', usul: usul, natija:'', sana: todayIso(), oqish: dmyToIso(m.oqishKuni) || tomorrowIso(), izoh:'', saving:false, error:'' }
    : { type:'noshow', sabab:'', izoh:'', saving:false, error:'' };
  keepScroll();
}
function saveSheet(){
  var sh = state.sheet, c = state.cand, call, okText;
  if (sh.type === 'contact') {
    if (!sh.natija) { sh.error = 'Natijani tanlang'; keepScroll(); return; }
    call = api('addContact', { id: c.id, usul: sh.usul, natija: sh.natija, sana: sh.sana, oqish: sh.oqish, izoh: sh.izoh });
    okText = sh.usul + ' yozib qo\'yildi: ' + (RES_TEXT[sh.natija] || sh.natija) + '.';
  } else {
    if (!sh.sabab) { sh.error = 'Sababni tanlang'; keepScroll(); return; }
    call = api('setNoShow', { id: c.id, sabab: sh.sabab + (sh.izoh ? ': ' + sh.izoh : '') });
    okText = 'Nomzod "O\'qishga kelmadi" deb belgilandi.';
  }
  if (sh.type === 'contact') {
    // Darhol ekranda ko'rsatamiz, server javobini kutmaymiz
    var m = c.meta, d = new Date(), p2 = function(n){ return ('0' + n).slice(-2); };
    m.aloqa = (m.aloqa || []).concat([{ sana: p2(d.getDate()) + '.' + p2(d.getMonth()+1) + '.' + d.getFullYear() + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes()), usul: sh.usul, natija: sh.natija, oqish: fmtDate(sh.oqish), izoh: sh.izoh, hr: 'saqlanmoqda…' }]);
    state.sheet = null; state.flash = { cls:'ok', text: esc(okText) }; keepScroll();
    call.then(function(){ if (state.cand === c) openCand(c.id, true, true); })
      .catch(function(e){ if (state.cand !== c) return; state.flash = { cls:'bad', text: 'Saqlanmadi: ' + esc(e.message === 'Failed to fetch' ? "Internet aloqasi yo'q." : e.message) }; openCand(c.id, true, true); });
    return;
  }
  sh.saving = true; sh.error = ''; keepScroll();
  call.then(function(j){ state.sheet = null; state.flash = { cls: j.holat === ST.NOSHOW ? 'warn' : 'ok', text: esc(okText) }; openCand(c.id, true, true); })
    .catch(function(e){ sh.saving = false; sh.error = e.message === 'Failed to fetch' ? "Internet aloqasi yo'q." : e.message; keepScroll(); });
}
function undoNoShow(){
  var c = state.cand;
  api('setNoShow', { id: c.id, undo: true }).then(function(j){ state.flash = { cls:'ok', text: 'Nomzod qayta taklif qilindi: holati "' + esc(j.holat) + '".' }; openCand(c.id, true, true); })
    .catch(function(e){ toastErr(e); render(); });
}
document.addEventListener('click', function(e){
  var t = e.target.closest('button, #sh-close'); if (!t || state.screen !== 'cand') return;
  if (t.dataset.contact) return openSheet('contact', t.dataset.contact);
  if (t.id === 'ns-open') return openSheet('noshow');
  if (t.id === 'ns-undo') return undoNoShow();
  var sh = state.sheet; if (!sh) return;
  if (t.id === 'sh-close' || t.id === 'sh-cancel') { state.sheet = null; keepScroll(); return; }
  if (t.id === 'sh-save') return saveSheet();
  if (t.dataset.usul) { sh.usul = t.dataset.usul; haptic(); keepScroll(); }
  else if (t.dataset.res) { sh.natija = t.dataset.res; sh.error = ''; haptic(); keepScroll(); }
  else if (t.dataset.sabab) { sh.sabab = t.dataset.sabab; sh.error = ''; haptic(); keepScroll(); }
});
document.addEventListener('input', function(e){
  var sh = state.sheet, t = e.target; if (!sh) return;
  if (t.id === 'sh-izoh') sh.izoh = t.value; else if (t.id === 'sh-sana') sh.sana = t.value; else if (t.id === 'sh-oqish') sh.oqish = t.value;
});
function editCand(){
  var c = state.cand; if (!c || !c.data) return;
  state.flash = null; state.editId = c.id; state.editMeta = c.meta;
  state.d = Object.assign(emptyAnketa(), JSON.parse(JSON.stringify(c.data)));
  state.d.oylik = money(state.d.oylik);
  state.step = 0; state.errors = {}; state.phoneMatches = null; state.jobEdit = null; state.submitError = ''; state.savedAt = 0;
  state.screen = 'form'; render(); scrollTop();
}
var searchTimer = null, searchSeq = 0;
function runSearch(){
  var q = (state.searchQ || '').trim(), my = ++searchSeq;
  if (q.length < 2) { updateCandList(); return; }
  state.searchLoading = true; updateCandList();
  api('search', { q: q }).then(function(j){ if (my !== searchSeq) return; state.searchRes = j.items || []; })
    .catch(function(){ if (my === searchSeq) state.searchRes = []; })
    .then(function(){ if (my === searchSeq) { state.searchLoading = false; updateCandList(); } });
}
function updateCandList(){ var el = document.getElementById('cand-list'); if (el && state.screen === 'home') { el.innerHTML = candListHtml(); return true; } return false; }
document.addEventListener('click', function(e){
  var it = e.target.closest('[data-cand]'); if (it) { openCand(it.dataset.cand); return; }
  var t = e.target.closest('button'); if (!t) return;
  if (t.id === 'c-back') { state.sheet = null; state.flash = null; goHome(); return; }
  if (t.dataset.filter) { state.filter = t.dataset.filter; haptic(); loadRecent(); return; }
  if (t.id === 'c-edit') { editCand(); return; }
});
document.addEventListener('keydown', function(e){ var it = e.target.closest && e.target.closest('[data-cand]'); if (it && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openCand(it.dataset.cand); } });
document.addEventListener('input', function(e){ if (e.target.id === 'q') { state.searchQ = e.target.value; clearTimeout(searchTimer); searchTimer = setTimeout(runSearch, 350); } });

/* ---------------- Boot ---------------- */
function applyTheme(){
  if (!TG) return;
  try { document.documentElement.setAttribute('data-theme', TG.colorScheme === 'dark' ? 'dark' : 'light'); } catch(e){}
}
function afterAuth(j){
  state.user = j.user; state.config = j.config || state.config;
  goHome();
}
/* Ilova ochilishi: keshdagi ma'lumot bilan darhol ochiladi, config + ro'yxat bitta so'rovda yangilanadi */
function startSession(onFail, noFast){
  var cfg = cache().cfg, f = state.filter || 'all', fast = !!cfg && !DEMO && !noFast;
  if (fast) { state.user = cfg.user; state.config = cfg.config || state.config; state.screen = 'home'; state.recentLoading = !showCachedRecent(f); render(); }
  var my = state.recentSeq = (state.recentSeq || 0) + 1;
  return api('config', { recent: f }).then(function(j){
    state.user = j.user; state.config = j.config || state.config; cachePut('cfg', { user: j.user, config: j.config });
    if (j.recent && my === state.recentSeq) { applyRecent(f, j.recent); state.recentLoading = false; if (state.screen === 'home') { if (!updateCandList()) render(); } }
    if (!fast) { state.screen = 'home'; render(); if (!j.recent) loadRecent(); }
    return j;
  }).catch(function(e){
    if (fast && e.message === 'Failed to fetch') { state.recentLoading = false; toastErr(e); render(); return; }
    if (e.code === 'auth' || e.code === 'forbidden') cacheClear();
    onFail(e);
  });
}
function pinLogin(){
  var v = (document.getElementById('pin') || {}).value || ''; if (!v) { state.pinError = 'PIN kiriting'; render(); return; }
  state.auth = { pin: v };
  startSession(function(e){ state.auth = null; state.screen = 'pin'; state.pinError = e.message || "PIN noto'g'ri"; render(); }, true)
    .then(function(j){ if (j) { ssSet('nomzod_pin', v); state.pinError = ''; } });
}
/* To'liq ekran: Telegram 8.0+. Tanlov eslab qolinadi. */
var FS_KEY = 'nomzod_toliq_ekran';
function canFs(){ try { return !!(TG && TG.isVersionAtLeast && TG.isVersionAtLeast('8.0') && TG.requestFullscreen); } catch(e){ return false; } }
function isFs(){ return !!(TG && TG.isFullscreen); }
function goFullscreen(){
  try {
    if (canFs() && lsGet(FS_KEY) !== false && !TG.isFullscreen) TG.requestFullscreen();
    if (TG.isVersionAtLeast && TG.isVersionAtLeast('7.7') && TG.disableVerticalSwipes) TG.disableVerticalSwipes();
    if (TG.onEvent) TG.onEvent('fullscreenChanged', updateFsBtn);
  } catch(e){}
}
function toggleFs(){
  if (!canFs()) return;
  try { if (isFs()) { TG.exitFullscreen(); lsSet(FS_KEY, false); } else { TG.requestFullscreen(); lsSet(FS_KEY, true); } } catch(e){}
}
var FS_ICON_IN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg>';
var FS_ICON_OUT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h5V3M21 8h-5V3M3 16h5v5M21 16h-5v5"/></svg>';
function fsBtnInner(){ return isFs() ? FS_ICON_OUT + '<span>Kichraytirish</span>' : FS_ICON_IN + '<span>To\'liq ekran</span>'; }
function fsBtn(){ return canFs() ? '<button type="button" class="icon-btn" id="fs-btn" title="' + (isFs() ? 'Kichik oynaga qaytish (Esc)' : "To'liq ekranga chiqish") + '">' + fsBtnInner() + '</button>' : ''; }
function updateFsBtn(){ var b = document.getElementById('fs-btn'); if (b) { b.innerHTML = fsBtnInner(); b.title = isFs() ? 'Kichik oynaga qaytish (Esc)' : "To'liq ekranga chiqish"; } }
document.addEventListener('click', function(e){ var t = e.target.closest('#fs-btn'); if (t) toggleFs(); });
document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && isFs()) { e.preventDefault(); toggleFs(); } });
function boot(){
  if (TG) { try { TG.ready(); TG.expand(); goFullscreen(); applyTheme(); TG.onEvent && TG.onEvent('themeChanged', applyTheme); TG.BackButton.onClick(function(){ if (state.screen === 'form') back(); else if (state.screen === 'gnew' || state.screen === 'day' || state.screen === 'exam') goGroups(); else if (state.screen === 'cand') goHome(); }); } catch(e){} }
  if (DEMO) { state.auth = { demo:true }; return api('config').then(afterAuth); }
  if (IN_TG) {
    state.auth = { initData: TG.initData };
    return startSession(function(e){ state.fatal = e.message || 'Server bilan aloqa yo\'q'; state.screen = 'fatal'; render(); });
  }
  var saved = ssGet('nomzod_pin');
  if (saved) { state.auth = { pin: saved }; return startSession(function(){ state.auth = null; state.screen = 'pin'; render(); }); }
  state.screen = 'pin'; render();
}
boot();
</script>
