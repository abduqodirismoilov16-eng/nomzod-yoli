<style>
:root{
  --navy:#0a1326; --ink:#ffffff; --mute:rgba(255,255,255,.72); --faint:rgba(255,255,255,.5);
  --gold:#d4b06f; --gold-hi:#ecd29b; --gold-lo:#b98d45; --teal:#5fe0c8; --amber:#ffcf7a; --red:#ff8a80;

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

body{font-family:var(--body);color:var(--ink);font-size:15px;line-height:1.45;background:var(--navy);overflow-x:hidden}
/* Fon: tun ko'ki ustida oltin, firuza va ko'k nur */
.bg{position:fixed;inset:0;z-index:-1;background:
  radial-gradient(60% 40% at 92% 2%,rgba(212,176,111,.55),transparent 70%),
  radial-gradient(70% 45% at 0% 30%,rgba(41,104,255,.55),transparent 70%),
  radial-gradient(70% 50% at 100% 75%,rgba(19,190,170,.40),transparent 70%),
  radial-gradient(60% 40% at 10% 100%,rgba(120,80,255,.35),transparent 70%),
  var(--navy)}
.bg::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,transparent 40%,rgba(5,10,22,.35))}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass{background:rgba(28,44,82,.82)}}

.ring{--p:0;width:84px;height:84px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;

.ico.pdf{background:rgba(255,110,110,.30)}.ico.doc{background:rgba(90,150,255,.36)}.ico.vid{background:rgba(95,224,200,.28)}.ico.img{background:rgba(212,176,111,.30)}.ico.lnk{background:rgba(160,120,255,.32)}.ico.oth{background:rgba(255,255,255,.18)}

.days button.on{background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:#1d1609;border-color:transparent}
.days button.on small{color:#4a3a1a}

.empty{color:var(--mute);font-size:14px;text-align:center;padding:18px 10px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stats .big{font-family:var(--display);font-size:26px;font-weight:600;line-height:1.1}

.tl{display:flex;flex-direction:column}

.dot.Keldi{background:var(--teal);box-shadow:0 0 0 4px rgba(95,224,200,.2)}
.dot.Kechikdi{background:var(--amber);box-shadow:0 0 0 4px rgba(255,207,122,.2)}
.dot.Kelmadi{background:var(--red);box-shadow:0 0 0 4px rgba(255,138,128,.2)}

.tl b{font-size:14px}.tl small{display:block;color:var(--mute);font-size:12.5px}
textarea{width:100%;min-height:130px;resize:vertical;font:inherit;color:var(--ink);background:rgba(255,255,255,.08);border:1px solid var(--edge);border-radius:14px;padding:12px}
textarea::placeholder{color:var(--faint)}
textarea:focus{outline:2px solid var(--gold);outline-offset:1px}
.hint{color:var(--mute);font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + var(--safe-b));z-index:30;max-width:92%;padding:11px 16px;border-radius:14px;font-size:14px;font-weight:600;
  background:rgba(20,32,60,.92);border:1px solid var(--edge);box-shadow:0 10px 30px -10px rgba(0,0,0,.6)}
.toast.ok{border-color:rgba(95,224,200,.6)}.toast.bad{border-color:rgba(255,138,128,.7)}
/* Pastki menyu */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 max(12px,env(safe-area-inset-right,0px)) calc(10px + var(--safe-b)) max(12px,env(safe-area-inset-left,0px))}
.tabs .glass{max-width:536px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);padding:6px;border-radius:22px;background:rgba(20,32,62,.55)}
.tab{appearance:none;border:0;background:none;color:var(--mute);font:inherit;font-size:11px;font-weight:600;padding:7px 0 5px;border-radius:16px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.tab svg{width:22px;height:22px}
.tab.on{color:#1d1609;background:linear-gradient(180deg,var(--gold-hi),var(--gold))}
/* Ko'ruvchi */
.vbar{display:flex;align-items:center;gap:10px;padding:10px 12px}
.vbar button{appearance:none;border:0;background:var(--glass-hi);color:var(--ink);width:36px;height:36px;border-radius:12px;font-size:20px;cursor:pointer;flex-shrink:0}
.vbar .t{min-width:0;flex:1}.vbar b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.vbar small{color:var(--mute);font-size:12px}
.viewer{position:relative;border-radius:18px;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.pages{display:flex;flex-direction:column;gap:10px}
.pages canvas{width:100%;height:auto;display:block;border-radius:10px;background:#fff;box-shadow:0 8px 24px -14px rgba(0,0,0,.7)}
.paper{background:#fff;color:#1b2333;border-radius:14px;padding:22px 18px;font-size:15px;line-height:1.6;overflow-wrap:anywhere}
.paper img{max-width:100%;height:auto}
.paper table{border-collapse:collapse;max-width:100%;display:block;overflow-x:auto}
.paper td,.paper th{border:1px solid #d6dce5;padding:5px 8px}
.paper h1,.paper h2,.paper h3{line-height:1.25}
video,audio,.viewer img.full{width:100%;display:block;border-radius:14px;background:#000}
.wm{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.wm span{position:absolute;white-space:nowrap;font-size:13px;font-weight:600;color:rgba(20,30,50,.10);transform:rotate(-28deg)}
.loading{display:flex;flex-direction:column;align-items:center;gap:12px;padding:40px 10px;color:var(--mute);text-align:center}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.2);border-top-color:var(--gold);animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.splash{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.splash img{width:96px;height:96px;border-radius:50%;box-shadow:0 0 0 3px rgba(212,176,111,.5),0 20px 50px -20px rgba(212,176,111,.8)}
.splash h1{font-family:var(--display);font-weight:600;font-size:22px;margin:0}
.demo{font-size:12px;text-align:center;color:var(--gold-hi);background:rgba(212,176,111,.14);border:1px solid rgba(212,176,111,.4);border-radius:12px;padding:6px}
.fade{animation:fd .28s ease both}
@keyframes fd{from{opacity:.0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade,.spin{animation:none}}
/* HR paneli */
.mini{display:flex;gap:4px;flex-shrink:0}
.mini button{appearance:none;width:32px;height:32px;border-radius:10px;border:1px solid var(--edge);background:var(--glass-hi);color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.mini button:disabled{opacity:.3;cursor:default}
.off{opacity:.5}
.mat.sel{border-color:rgba(212,176,111,.7);background:rgba(212,176,111,.14)}
.drop{display:flex;flex-direction:column;align-items:center;gap:2px;border:1.5px dashed rgba(212,176,111,.75);border-radius:16px;padding:16px;text-align:center;color:var(--gold-hi);font-weight:700;background:rgba(212,176,111,.08);cursor:pointer}
.drop small{font-weight:400;color:var(--mute);font-size:12px}
.dim{position:fixed;inset:0;background:rgba(5,10,22,.55);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:560px;margin:0 auto;border-radius:24px 24px 0 0;padding:16px 16px calc(18px + var(--safe-b));display:flex;flex-direction:column;gap:10px;max-height:88vh;overflow-y:auto;background:rgba(18,30,58,.9)}
.lite .sheet{background:rgb(22,36,68)}
.sh-t{font-family:var(--display);font-weight:600;font-size:16px}
.inp{width:100%;font:inherit;color:var(--ink);background:rgba(255,255,255,.08);border:1px solid var(--edge);border-radius:12px;padding:11px}
.inp:focus{outline:2px solid var(--gold);outline-offset:1px}
.err{color:#ffc4be;background:rgba(255,138,128,.14);border:1px solid rgba(255,138,128,.5);border-radius:12px;padding:9px 11px;font-size:13.5px}
.st-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.st-grid .glass{padding:10px 6px}.st-grid .big{display:block;font-family:var(--display);font-size:22px}.st-grid small{color:var(--mute);font-size:11.5px}
.st.bad{background:rgba(255,138,128,.18);border:1px solid rgba(255,138,128,.5);color:#ffc4be}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.15);overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--teal))}
.qa{display:flex;flex-direction:column;gap:8px}
.qa .qh{display:flex;justify-content:space-between;gap:8px;align-items:baseline}.qa .qh small{color:var(--faint);font-size:11.5px;white-space:nowrap}
.qa .ans{border-left:2px solid var(--gold);padding-left:9px;color:var(--mute)}
.off2{opacity:.75}
.qa textarea{min-height:64px}
.badge{position:absolute;top:2px;right:calc(50% - 22px);min-width:16px;height:16px;border-radius:999px;background:#ff6f61;color:#fff;font-size:10px;line-height:16px;padding:0 4px}
</style>

<script>

try {

  if (lite) document.documentElement.classList.add('lite');
} catch (e) {}

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function dm(iso){ var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || ''); return m ? m[3] + '.' + m[2] : ''; }
function dmy(iso){ var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || ''); return m ? m[3] + '.' + m[2] + '.' + m[1] : ''; }
function haptic(k){ try { TG && TG.HapticFeedback && (k === 'ok' ? TG.HapticFeedback.notificationOccurred('success') : TG.HapticFeedback.impactOccurred('light')); } catch (e) {} }
var toastT;

function api(action, data){
  if (DEMO) return demoApi(action, data || {});
  return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action: action, data: data || {}, auth: { initData: TG.initData } }) })
    .then(function(r){ return r.json(); })
    .then(function(j){ if (!j.ok) throw new Error(j.error || 'Xatolik'); return j; });
}

/* ---------- Namuna (demo) ma'lumotlari ---------- */
function isoPlus(n){ var d = new Date(); d.setDate(d.getDate() + n); return d.getFullYear() + '-' + ('0'+(d.getMonth()+1)).slice(-2) + '-' + ('0'+d.getDate()).slice(-2); }
var demoDb = {
  me: { name: 'Rahimov Sardor Aliyevich', first: 'Sardor', group: '#1', start: isoPlus(-1), exam: isoPlus(4), today: 2 },
  days: [
    { day:1, date:isoPlus(-1), open:true, read:true, att:'Keldi', mats:[
      { t:1, nomi:'Kompaniya bilan tanishuv', turi:'PDF', seen:true },
      { t:2, nomi:'CRM bilan ishlash, 1-qism', turi:'Video', seen:true },
      { t:3, nomi:'Mijoz bilan suhbat skripti', turi:'Word', seen:true } ] },
    { day:2, date:isoPlus(0), open:true, read:false, att:'Kechikdi', mats:[
      { t:1, nomi:'Kassa bilan ishlash', turi:'PDF', seen:true },
      { t:2, nomi:'CRM bilan ishlash, 2-qism', turi:'Video', seen:false },
      { t:3, nomi:'Mahsulotlar katalogi', turi:'Havola', seen:false } ] },
    { day:3, date:isoPlus(1), open:false, read:false, att:'', mats:[] },
    { day:4, date:isoPlus(2), open:false, read:false, att:'', mats:[] },
    { day:5, date:isoPlus(3), open:false, read:false, att:'', mats:[] } ]
};
function demoApi(action, d){
  return new Promise(function(res, rej){ setTimeout(function(){
    if (action === 'oq.me') return res(DEMO_HR ? { ok:true, linked:false, hr:true } : { ok:true, linked:true, me: demoDb.me, days: demoDb.days });
    if (action.indexOf('oq.hr.') === 0) return demoHr(action, d).then(res, rej);
    if (action === 'oq.read') { demoDb.days[d.day-1].read = true; return res({ ok:true }); }
    if (action === 'oq.ask') return res({ ok:true });
    if (action === 'oq.chat') return res({ ok:true });
    if (action === 'oq.file') {
      var m = demoDb.days[d.day-1].mats.filter(function(x){ return x.t === d.t; })[0]; m.seen = true;
      if (m.turi === 'Havola') return res({ ok:true, kind:'link', name:m.nomi, url:'https://example.com', text:'Mahsulotlar katalogi https://example.com' });
      if (m.turi === 'PDF') return fetch('namuna.pdf').then(function(r){ return r.arrayBuffer(); }).then(function(b){ res({ ok:true, kind:'pdf', name:m.nomi, buf:b }); }).catch(rej);
      if (m.turi === 'Word') return res({ ok:true, kind:'html', name:m.nomi, html:'<h2>Mijoz bilan suhbat skripti</h2><p><b>1. Salomlashish.</b> Assalomu alaykum! Doctor Ali, mening ismim Sardor. Sizga qanday yordam bera olaman?</p><p><b>2. Ehtiyojni aniqlash.</b> Mijozning savoliga diqqat bilan quloq soling va qisqa savollar bering.</p><p><b>3. Taklif.</b> Mos mahsulotni nomi, narxi va afzalligi bilan ayting.</p><p><b>4. Xayrlashish.</b> Rahmat, yana kutib qolamiz!</p>' });
      return res({ ok:true, kind:'chat', reason:'big', name:m.nomi });
    }
    rej(new Error("Noma'lum amal"));
  }, 350); });
}

function icoFor(turi){
  if (turi === 'PDF') return '<span class="ico pdf">PDF</span>';
  if (turi === 'Word') return '<span class="ico doc">DOC</span>';
  if (/Video/.test(turi)) return '<span class="ico vid">▶</span>';
  if (turi === 'Rasm') return '<span class="ico img">IMG</span>';
  if (turi === 'Havola') return '<span class="ico lnk">↗</span>';
  if (turi === 'Audio' || turi === 'Ovozli') return '<span class="ico vid">♪</span>';
  return '<span class="ico oth">FILE</span>';
}

/* ---------- Hisob-kitob ---------- */
function currentDay(){
  var d = state.data, t = d.me.today, open = d.days.filter(function(x){ return x.open; });
  if (!open.length) return null;
  var today = open.filter(function(x){ return x.day === t; })[0];
  return today || open[open.length - 1];
}
function counts(){
  var mats = 0, seen = 0, read = 0, came = 0, marked = 0;
  state.data.days.forEach(function(x){
    x.mats.forEach(function(m){ mats++; if (m.seen) seen++; });
    if (x.read) read++;
    if (x.att) { marked++; if (x.att !== 'Kelmadi') came++; }
  });
  return { mats: mats, seen: seen, read: read, came: came, marked: marked };
}
function daysToExam(){
  var e = state.data.me.exam; if (!e) return null;
  var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(e); var ex = new Date(+m[1], +m[2]-1, +m[3]);
  var t = new Date(); t = new Date(t.getFullYear(), t.getMonth(), t.getDate());
  return Math.round((ex - t) / 864e5);
}

/* ---------- Material ko'ruvchi ---------- */
function openViewer(day, t, meta){
  var m = meta || state.data.days[day - 1].mats.filter(function(x){ return x.t === t; })[0];
  var action = state.mode === 'hr' ? 'oq.hr.preview' : 'oq.file';
  state.viewer = { day: day, t: t };
  tabsEl.hidden = true;
  try { TG && TG.BackButton && TG.BackButton.show(); } catch (e) {}
  app.innerHTML = '<div class="glass vbar"><button type="button" id="v-back" aria-label="Orqaga">‹</button><div class="t"><b>' + esc(m.nomi) + '</b><small>' + day + '-kun · ' + esc(m.turi) + '</small></div></div>' +
    '<div id="vbody"><div class="loading"><div class="spin"></div>Yuklanmoqda…<small>Video va katta fayllar biroz vaqt olishi mumkin</small></div></div>';
  window.scrollTo(0, 0);
  api(action, { day: day, t: t }).then(function(j){
    if (!state.viewer || state.viewer.day !== day || state.viewer.t !== t) return;
    m.seen = true;
    showFile(j, day, t);
  }).catch(function(e){
    if (!state.viewer) return;
    document.getElementById('vbody').innerHTML = '<div class="glass empty">' + esc(errText(e)) + '</div>';
  });
}
function closeViewer(){
  if (state.viewer && state.viewer.url) { try { URL.revokeObjectURL(state.viewer.url); } catch (e) {} }
  state.viewer = null; render(); window.scrollTo(0, 0);
}
function b64ToBytes(b64){ var bin = atob(b64), n = bin.length, u = new Uint8Array(n); for (var i = 0; i < n; i++) u[i] = bin.charCodeAt(i); return u; }
function wmHtml(){
  var name = (state.mode === 'hr' ? "HR ko'rib chiqish" : state.data.me.name) + ' · Doctor Ali', out = '';
  for (var y = 0; y < 30; y++) for (var x = 0; x < 3; x++) out += '<span style="top:' + (y * 150 + (x % 2) * 70) + 'px;left:' + (x * 38 - 10) + '%">' + esc(name) + '</span>';
  return '<div class="wm" aria-hidden="true">' + out + '</div>';
}
function chatBtn(day, t){ if (state.mode === 'hr') return ''; return '<button class="btn ghost" type="button" data-chat="' + day + ':' + t + '" style="margin-top:12px">Telegram chatida ochish</button>'; }
function loadScript(src){ return new Promise(function(res, rej){ var s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = function(){ rej(new Error("Ko'ruvchini yuklab bo'lmadi. Internetni tekshiring")); }; document.head.appendChild(s); }); }
function showFile(j, day, t){
  var body = document.getElementById('vbody');
  var bytes = j.buf ? new Uint8Array(j.buf) : (j.data ? b64ToBytes(j.data) : null);
  if (j.kind === 'link') {
    body.innerHTML = '<div class="glass" style="display:flex;flex-direction:column;gap:12px"><p style="margin:0;overflow-wrap:anywhere">' + esc(j.text) + '</p><button class="btn" type="button" data-link="' + esc(j.url) + '">Havolani ochish ↗</button></div>';
    return;
  }
  if (j.kind === 'chat') {
    body.innerHTML = '<div class="glass" style="display:flex;flex-direction:column;gap:10px;text-align:center"><b>' + (j.reason === 'big' ? 'Fayl ilova uchun juda katta' : 'Bu formatni ilovada ochib bo\'lmaydi') + '</b>' +
      '<p class="hint" style="margin:0">Uni Telegram chatiga himoyalangan holda yuboramiz, o\'sha yerda ochiladi.</p>' + chatBtn(day, t).replace('btn ghost', 'btn') + '</div>';
    return;
  }
  if (j.kind === 'pdf') {
    body.innerHTML = '<div class="viewer"><div class="pages" id="pages"><div class="loading"><div class="spin"></div>Sahifalar tayyorlanmoqda…</div></div>' + wmHtml() + '</div>' + chatBtn(day, t);
    (window.pdfjsLib ? Promise.resolve() : loadScript(PDFJS + 'pdf.min.js')).then(function(){
      pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js';
      return pdfjsLib.getDocument({ data: bytes }).promise;
    }).then(function(pdf){
      var box = document.getElementById('pages'); if (!box) return;
      box.innerHTML = '';
      var w = box.clientWidth, ratio = Math.min(window.devicePixelRatio || 1, 2), n = 1;
      function next(){
        if (n > pdf.numPages || !document.getElementById('pages')) return;
        pdf.getPage(n).then(function(page){
          var v1 = page.getViewport({ scale: 1 }), scale = (w / v1.width) * ratio, vp = page.getViewport({ scale: scale });
          var cv = document.createElement('canvas'); cv.width = vp.width; cv.height = vp.height; cv.setAttribute('aria-label', n + '-bet');
          box.appendChild(cv);
          return page.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
        }).then(function(){ n++; next(); });
      }
      next();
    }).catch(function(e){ var b = document.getElementById('pages'); if (b) b.innerHTML = '<div class="glass empty">PDF ochilmadi: ' + esc(e.message) + '</div>'; });
    return;
  }
  if (j.kind === 'docx' || j.kind === 'html') {
    body.innerHTML = '<div class="viewer"><div class="paper" id="paper"><div class="loading" style="color:#5a6779"><div class="spin"></div>Hujjat tayyorlanmoqda…</div></div>' + wmHtml() + '</div>' + chatBtn(day, t);
    if (j.kind === 'html') { document.getElementById('paper').innerHTML = j.html; return; }
    (window.mammoth ? Promise.resolve() : loadScript(MAMMOTH)).then(function(){
      return mammoth.convertToHtml({ arrayBuffer: bytes.buffer });
    }).then(function(r){
      var p = document.getElementById('paper'); if (!p) return;
      p.innerHTML = r.value.replace(/<script[\s\S]*?<\/script>/gi, '') || '<p>Hujjat bo\'sh.</p>';
    }).catch(function(e){ var p = document.getElementById('paper'); if (p) p.innerHTML = '<p>Hujjat ochilmadi: ' + esc(e.message) + '</p>'; });
    return;
  }
  var url = URL.createObjectURL(new Blob([bytes], { type: j.mime || 'application/octet-stream' }));
  state.viewer.url = url;
  if (j.kind === 'video') body.innerHTML = '<div class="viewer"><video src="' + url + '" controls playsinline controlsList="nodownload noplaybackrate" disablePictureInPicture oncontextmenu="return false"></video></div>' + chatBtn(day, t);
  else if (j.kind === 'audio') body.innerHTML = '<div class="glass"><audio src="' + url + '" controls controlsList="nodownload" style="background:transparent"></audio></div>' + chatBtn(day, t);
  else if (j.kind === 'image') body.innerHTML = '<div class="viewer"><img class="full" src="' + url + '" alt="' + esc(j.name) + '" draggable="false">' + wmHtml() + '</div>' + chatBtn(day, t);
  else body.innerHTML = '<div class="glass empty">Bu faylni ko\'rsatib bo\'lmadi.</div>' + chatBtn(day, t);
}
function errText(e){ return e && e.message === 'Failed to fetch' ? "Internet aloqasi yo'q. Qayta urinib ko'ring." : (e && e.message || 'Xatolik'); }

/* ---------- Hodisalar ---------- */
document.addEventListener('click', function(e){
  var b = e.target.closest('button'); if (!b || b.disabled) return;
  if (b.dataset.tab) { state.tab = b.dataset.tab; if (b.dataset.tab === 'days') state.day = null; haptic(); render(); window.scrollTo(0, 0); return; }
  if (b.dataset.goday) { state.tab = 'days'; state.day = +b.dataset.goday; haptic(); render(); window.scrollTo(0, 0); return; }
  if (b.dataset.day) { state.day = +b.dataset.day; haptic(); render(); return; }
  if (b.dataset.open) { var p = b.dataset.open.split(':'); haptic(); openViewer(+p[0], +p[1]); return; }
  if (b.id === 'v-back') { closeViewer(); return; }
  if (b.dataset.link) { try { TG && TG.openLink ? TG.openLink(b.dataset.link) : window.open(b.dataset.link, '_blank'); } catch (x) { window.open(b.dataset.link, '_blank'); } return; }
  if (b.dataset.chat) {
    var q = b.dataset.chat.split(':'); b.disabled = true; b.textContent = 'Yuborilmoqda…';
    api('oq.chat', { day: +q[0], t: +q[1] }).then(function(){ haptic('ok'); b.textContent = '✅ Chatga yuborildi'; toast('Material chatga yuborildi', 'ok'); })
      .catch(function(x){ b.disabled = false; b.textContent = 'Telegram chatida ochish'; toast(errText(x), 'bad'); });
    return;
  }
  if (b.dataset.read) {
    var day = +b.dataset.read; state.sending = true; render();
    api('oq.read', { day: day }).then(function(){ state.data.days[day - 1].read = true; haptic('ok'); toast('Rahmat! ' + day + '-kun o\'qildi deb belgilandi', 'ok'); })
      .catch(function(x){ toast(errText(x), 'bad'); }).then(function(){ state.sending = false; render(); });
    return;
  }
  if (b.id === 'ask-send') {
    var text = (document.getElementById('q').value || '').trim();
    if (!text) { toast('Avval savolingizni yozing', 'bad'); return; }
    state.draft = text; state.sending = true; render();
    api('oq.ask', { text: text }).then(function(){ state.draft = ''; haptic('ok'); toast("Savolingiz HR'ga yuborildi", 'ok'); })
      .catch(function(x){ toast(errText(x), 'bad'); }).then(function(){ state.sending = false; render(); });
    return;
  }
  if (b.id === 'reload') { start(); return; }
  if (b.id === 'to-bot') { try { TG.close(); } catch (x) {} return; }
});
document.addEventListener('input', function(e){ if (e.target.id === 'q') state.draft = e.target.value; });

      { name:'Tursunov Bekzod', linked:true, days:{1:{st:'Yuborildi',read:false,seen:1},2:{st:'Yuborildi',read:false,seen:0}} },
      { name:'Karimov Jasur', linked:false, days:{1:{st:'Ulanmagan'},2:{st:'Ulanmagan'}} } ] });
    if (action === 'oq.hr.remind') return res({ ok:true, count:2 });
    if (action === 'oq.hr.questions') return res({ ok:true, items: db.qs });
    if (action === 'oq.hr.answer') { db.qs.forEach(function(q){ if (q.row === d.row) q.javob = d.text; }); return res({ ok:true, items: db.qs }); }
    res({ ok:false, error:'?' });
  }, 300); });
}

/* ---------- Ishga tushirish ---------- */
function start(){
  app.innerHTML = '<div class="splash"><img src="logo.png" alt="Doctor Ali"><div class="spin"></div></div>'; tabsEl.hidden = true;
  api('oq.me').then(function(j){
    if (!j.linked) {
      if (j.hr) return hrStart();
      return message('Avval botga ulaning', "Botdagi «📱 Telefon raqamni yuborish» tugmasini bosing. Shundan keyin ilova sizni taniydi.", '<button class="btn" type="button" id="to-bot" style="max-width:260px">Botga qaytish</button>');
    }
    if (j.expelled) return message("Kirish yopilgan", "Siz o'qishdan chetlatilgansiz. Savol bo'lsa, HR bilan bog'laning.");
    state.data = { me: j.me, days: j.days }; render();
  }).catch(function(e){
    message("Ochilmadi", esc(errText(e)), '<button class="btn" type="button" id="reload" style="max-width:260px">Qayta urinish</button>');
  });
}
if (TG) {
  try {
    TG.ready(); TG.expand();
    TG.setHeaderColor && TG.setHeaderColor('#0a1326'); TG.setBackgroundColor && TG.setBackgroundColor('#0a1326');
    TG.setBottomBarColor && TG.setBottomBarColor('#0a1326');
    TG.disableVerticalSwipes && TG.disableVerticalSwipes();
    TG.BackButton.onClick(function(){ if (state.viewer) closeViewer(); else if (state.sheet) { state.sheet = null; render(); } });
  } catch (e) {}
}
start();
